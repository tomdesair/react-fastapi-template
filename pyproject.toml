[project]
name = "react-fastapi-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Anibal Angulo", email = "ajcardoza2000@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
    "uvicorn>=0.34.2",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
venvPath = "."
venv = ".venv"
